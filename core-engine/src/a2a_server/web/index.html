<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>财神 MoneyGod · 每日量化抽签</title>
<style>
  :root{
    --red:#b71c1c; --red2:#7f0e0e; --gold:#f6c453; --gold2:#e0a92e;
    --ink:#2b1a12; --paper:#fff8ec; --muted:#8a7357;
    --up:#d32f2f; --down:#2e7d32; /* A股习惯:红涨绿跌 */
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
    color:var(--ink);background:
      radial-gradient(1200px 600px at 50% -10%, #d94a3d 0%, var(--red) 40%, var(--red2) 100%) fixed;
    min-height:100vh;}
  .wrap{max-width:960px;margin:0 auto;padding:28px 18px 60px}
  header{text-align:center;color:#fff;margin-bottom:18px}
  .logo{font-size:48px;line-height:1}
  h1{margin:6px 0 2px;font-size:26px;letter-spacing:2px}
  .tag{color:var(--gold);font-size:14px;letter-spacing:6px}
  .sub{color:#ffe9c7;font-size:12px;margin-top:6px;opacity:.9}
  .panel{background:var(--paper);border-radius:16px;padding:18px;
    box-shadow:0 12px 40px rgba(0,0,0,.28);border:2px solid var(--gold)}
  .ask{display:flex;flex-direction:column;gap:12px}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  textarea{width:100%;min-height:70px;resize:vertical;border:1.5px solid #e4d3ad;border-radius:10px;
    padding:12px;font-size:15px;background:#fffdf7;color:var(--ink)}
  select{border:1.5px solid #e4d3ad;border-radius:10px;padding:10px;background:#fffdf7;font-size:14px}
  .btn{background:linear-gradient(180deg,var(--gold),var(--gold2));border:none;color:#5a3b00;
    font-weight:700;font-size:16px;padding:12px 26px;border-radius:999px;cursor:pointer;
    box-shadow:0 4px 0 #b9861f;letter-spacing:2px}
  .btn:active{transform:translateY(2px);box-shadow:0 2px 0 #b9861f}
  .btn[disabled]{opacity:.6;cursor:not-allowed}
  .chips{display:flex;gap:8px;flex-wrap:wrap}
  .chip{background:#fbeccb;border:1px solid #e4d3ad;border-radius:999px;padding:6px 12px;
    font-size:13px;color:#7a5a1e;cursor:pointer}
  .chip:hover{background:#f7e0a8}
  .muted{color:var(--muted);font-size:12px}
  .hidden{display:none}
  #result{margin-top:18px;display:flex;flex-direction:column;gap:16px}
  .card{background:var(--paper);border-radius:14px;padding:16px;border:2px solid var(--gold);
    box-shadow:0 8px 24px rgba(0,0,0,.22)}
  .card h2{margin:0 0 12px;font-size:16px;display:flex;align-items:center;gap:8px;
    border-bottom:1px dashed #e0cfa6;padding-bottom:8px}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
  .mini{background:#fffdf7;border:1px solid #eaddbd;border-radius:12px;padding:12px}
  .mini .name{font-weight:700;font-size:15px}
  .mini .code{color:var(--muted);font-size:12px;margin-left:4px}
  .mini .price{font-size:22px;font-weight:800;margin:6px 0}
  .metrics{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .m{background:#fbeccb;border-radius:8px;padding:4px 8px;font-size:12px}
  .up{color:var(--up)} .down{color:var(--down)}
  .badge{display:inline-block;padding:4px 12px;border-radius:999px;font-weight:700;font-size:13px;color:#fff}
  .b-buy{background:#d32f2f} .b-hold{background:#f39c12} .b-reduce{background:#8e44ad} .b-watch{background:#607d8b}
  .sig{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px dashed #eaddbd}
  .sig:last-child{border-bottom:none}
  .sig .body{flex:1}
  .conf{font-size:12px;color:var(--muted)}
  .risk{background:#fff3f3;border:1px solid #f3c9c9;color:#a02020;border-radius:8px;
    padding:8px 10px;font-size:13px;margin-top:6px}
  .qa{white-space:pre-wrap;line-height:1.7;font-size:14px}
  .disclaimer{color:#ffe9c7;font-size:12px;line-height:1.6;text-align:center;margin-top:6px;padding:0 8px}
  .src{color:var(--muted);font-size:12px;margin-top:8px}
  .fortune{text-align:center;background:linear-gradient(180deg,#fff3d6,#ffe4a8);
    border:2px solid var(--gold2)}
  .fortune .lvl{font-size:30px;font-weight:900;letter-spacing:6px;color:var(--red)}
  .fortune .sen{color:#7a5a1e;margin-top:4px}
  .spark{display:block;margin-top:8px}
  .loading{text-align:center;color:#fff;padding:20px}
  .lantern{font-size:34px;animation:sway 1.4s ease-in-out infinite}
  @keyframes sway{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(8deg)}}
  .err{background:#fff3f3;border:2px solid #f3c9c9;color:#a02020}
  /* 多 Agent 协作 */
  .flow{display:flex;flex-direction:column;gap:0}
  .node{display:flex;gap:10px;align-items:flex-start;position:relative;padding:8px 0}
  .node:not(:last-child)::before{content:'';position:absolute;left:15px;top:30px;bottom:-8px;width:2px;background:#e0cfa6}
  .abadge{flex:0 0 auto;width:32px;height:32px;border-radius:50%;display:flex;align-items:center;
    justify-content:center;font-size:14px;color:#fff;font-weight:700;z-index:1}
  .a-Planner{background:#5c6bc0}.a-Factor{background:#26a69a}.a-Strategy{background:#ec407a}
  .a-Backtest{background:#ab47bc}.a-Risk{background:#ef6c00}.a-Report{background:#43a047}
  .node .txt{flex:1;font-size:13px;padding-top:6px}
  .node .who{font-weight:700;font-size:12px;color:var(--muted)}
  .kpis{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0}
  .kpi{background:#fbeccb;border-radius:10px;padding:8px 12px;text-align:center;min-width:88px}
  .kpi .v{font-size:18px;font-weight:800}
  .kpi .k{font-size:11px;color:var(--muted)}
  .rank{display:flex;flex-wrap:wrap;gap:8px}
  .rank .r{background:#fffdf7;border:1px solid #eaddbd;border-radius:10px;padding:6px 12px;font-size:13px}
  .rank .r b{color:var(--red)}
  .win{background:#e8f5e9;border:1px solid #a5d6a7;color:#2e7d32}
  .lose{background:#fff3e0;border:1px solid #ffcc80;color:#ef6c00}
  table.bt{width:100%;border-collapse:collapse;font-size:13px;margin-top:6px}
  table.bt th,table.bt td{border:1px solid #eaddbd;padding:6px 8px;text-align:center}
  table.bt th{background:#fbeccb}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">🧧🀄💰</div>
    <h1>财神 MoneyGod</h1>
    <div class="tag">玄 学 皮 · 量 化 芯</div>
    <div class="sub">多 Agent 投研团队 · 因子→策略→回测反馈闭环 · 数字由代码算 · 非投资建议</div>
  </header>

  <div class="panel">
    <div class="ask">
      <textarea id="q" placeholder="输入标的代码或投研需求，例如：用 600519.SH 000858.SZ 601318.SH 构建稳健多因子策略并回测"></textarea>
      <div class="row">
        <label class="muted">风险偏好</label>
        <select id="risk">
          <option value="conservative">稳健型</option>
          <option value="balanced" selected>平衡型</option>
          <option value="aggressive">进取型</option>
        </select>
        <button class="btn" id="go">求 财 神 签</button>
      </div>
      <div class="chips" id="samples">
        <span class="chip">用 600519.SH 000858.SZ 601318.SH 构建多因子策略并回测</span>
        <span class="chip">给 600036.SH 000333.SZ 做因子分析和风险评估</span>
        <span class="chip">今天 A股 大盘怎么样？情绪偏乐观还是谨慎</span>
      </div>
    </div>
  </div>

  <div id="loading" class="loading hidden">
    <div class="lantern">🏮</div>
    <div>财神召集投研团队(Planner→Factor→Strategy→Backtest→Risk→Report)协作运算中…</div>
  </div>

  <div id="result"></div>

  <div class="disclaimer" id="footer"></div>
</div>

<script>
const $ = s => document.querySelector(s);
const el = (t, c, h) => { const e=document.createElement(t); if(c)e.className=c; if(h!=null)e.innerHTML=h; return e; };
const esc = s => String(s??"").replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));
const pct = v => (v>0?'+':'') + v + '%';
const cls = v => v>0?'up':(v<0?'down':'');

function spark(history, w=200, h=44){
  if(!history || history.length<2) return '';
  const xs = history.map(p=>p.close);
  const min=Math.min(...xs), max=Math.max(...xs), rng=(max-min)||1;
  const step = w/(xs.length-1);
  const pts = xs.map((v,i)=>`${(i*step).toFixed(1)},${(h-((v-min)/rng)*h).toFixed(1)}`).join(' ');
  const up = xs[xs.length-1] >= xs[0];
  const color = up ? '#d32f2f' : '#2e7d32';
  return `<svg class="spark" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">
    <polyline fill="none" stroke="${color}" stroke-width="2" points="${pts}"/></svg>`;
}

function indexCard(name, v){
  if(v.error) return `<div class="mini"><div class="name">${esc(name)}</div><div class="muted">数据异常</div></div>`;
  return `<div class="mini">
    <div><span class="name">${esc(name)}</span><span class="code">${esc(v.code)}</span></div>
    <div class="price">${v.close}</div>
    <div class="metrics">
      <span class="m ${cls(v.chg_pct)}">当日 ${pct(v.chg_pct)}</span>
      <span class="m ${cls(v.momentum_90d_pct)}">90日 ${pct(v.momentum_90d_pct)}</span>
      <span class="m">区间位 ${v.range_position}</span>
    </div>
    ${spark(v.history)}
  </div>`;
}

function targetCard(t){
  const nm = t.market_name || t.name || t.code;
  if(t.error || t.note){
    return `<div class="mini"><div class="name">${esc(nm)}</div>
      <div class="code">${esc(t.code)}</div>
      <div class="risk">${esc(t.error||t.note)}</div></div>`;
  }
  const ind = t.industry ? `<span class="m">行业 ${esc(t.industry)}</span>` : '';
  return `<div class="mini">
    <div><span class="name">${esc(nm)}</span><span class="code">${esc(t.code)}</span></div>
    <div class="price">${t.close}</div>
    <div class="metrics">
      <span class="m ${cls(t.chg_pct)}">当日 ${pct(t.chg_pct)}</span>
      <span class="m ${cls(t.momentum_pct)}">区间动量 ${pct(t.momentum_pct)}</span>
      <span class="m down">最大回撤 ${t.max_drawdown_pct}%</span>
      <span class="m">区间位 ${t.range_position}</span>
      ${ind}
    </div>
    ${spark(t.history)}
  </div>`;
}

const ACT = {buy:'b-buy',hold:'b-hold',reduce:'b-reduce',watch:'b-watch'};

function lineChart(series, w=560, h=140){
  if(!series || series.length<2) return '';
  const min=Math.min(...series), max=Math.max(...series), rng=(max-min)||1;
  const step = w/(series.length-1);
  const pts = series.map((v,i)=>`${(i*step).toFixed(1)},${(h-((v-min)/rng)*(h-16)-8).toFixed(1)}`).join(' ');
  const up = series[series.length-1] >= series[0];
  const color = up ? '#d32f2f' : '#2e7d32';
  const base = (h-((1-min)/rng)*(h-16)-8).toFixed(1); // 净值=1 基线
  return `<svg width="100%" height="${h}" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" style="display:block">
    <line x1="0" y1="${base}" x2="${w}" y2="${base}" stroke="#cbb98f" stroke-dasharray="4 4" stroke-width="1"/>
    <polyline fill="none" stroke="${color}" stroke-width="2" points="${pts}"/>
  </svg>`;
}

function num(v, p=2){ return (v==null)?'-':(v*100).toFixed(p)+'%'; }
function raw(v, p=2){ return (v==null)?'-':Number(v).toFixed(p); }

function fortuneCard(adv){
  const c = el('div','card fortune');
  c.innerHTML = `<div class="lvl">今 日 · ${esc(adv.actionHintCn||'宜观')}</div>
    <div class="sen" style="font-size:16px;font-weight:700;margin-top:6px">${esc(adv.signature||'')}</div>
    <div class="sen">${esc(adv.plainAdvice||'')}</div>`;
  return c;
}

function onchainCard(onchain){
  const c = el('div','card');
  if(onchain && onchain.ok){
    c.innerHTML = `<h2>⛓️ 链上存证</h2>
      <div>已锚定 Injective 测试网,交易哈希:
        <a href="${esc(onchain.explorerUrl)}" target="_blank" rel="noopener">${esc(onchain.txHash)}</a>
      </div>`;
  } else {
    c.innerHTML = `<h2>⛓️ 链上存证</h2>
      <div class="muted">本次未能上链存证,不影响分析结果${onchain && onchain.reason ? '('+esc(onchain.reason)+')' : ''}</div>`;
  }
  return c;
}

function renderWorkflow(data){
  const box = $('#result');

  // 0) 签文（先给用户看仪式感结论，细节往下翻）
  box.appendChild(fortuneCard(data.advice||{}));
  box.appendChild(onchainCard(data.onchain));

  // 1) 多 Agent 协作轨迹
  const trace = data.trace||[];
  const flow = el('div','card');
  flow.innerHTML = `<h2>🤝 多 Agent 协作过程（共 ${trace.length} 步 · 策略迭代 ${data.iterations} 轮）</h2>`;
  const fw = el('div','flow');
  trace.forEach(t=>{
    fw.appendChild(el('div','node',
      `<div class="abadge a-${esc(t.agent)}">${esc(t.agent[0])}</div>
       <div class="txt"><span class="who">${esc(t.agent)}</span> · ${esc(t.action)}</div>`));
  });
  flow.appendChild(fw); box.appendChild(flow);

  // 2) 因子排名
  const f = data.factor||{};
  if((f.ranking||[]).length){
    const c = el('div','card');
    const comp = f.composite||{};
    c.innerHTML = `<h2>🔬 因子研究 · 横截面多因子打分</h2>
      <div class="rank">${f.ranking.map((code,i)=>
        `<div class="r">${i===0?'<b>①</b>':'#'+(i+1)} ${esc(code)} <span class="muted">综合分 ${raw(comp[code],3)}</span></div>`
      ).join('')}</div>
      <div class="muted" style="margin-top:8px">因子:动量·估值·质量·成长·低波，全部由代码计算并 z-score 标准化。</div>`;
    box.appendChild(c);
  }

  // 3) 策略 + 回测
  const bt = data.backtest||{}, bm = data.benchmark||{}, p = data.strategyParams||{};
  const c = el('div','card');
  const beat = data.beatBenchmark;
  let html = `<h2>📉 策略回测 · 自算引擎（数字可复现）</h2>`;
  html += `<div class="muted">最终参数:因子权重 ${esc(JSON.stringify(p.weights||{}))} · 持仓 ${p.top_k} · 调仓 ${p.rebalance}日 · 回看 ${p.lookback_days}日</div>`;
  if(bt.ok){
    html += `<div class="kpis">
      <div class="kpi"><div class="v ${cls(bt.annualized_return)}">${num(bt.annualized_return)}</div><div class="k">年化收益</div></div>
      <div class="kpi"><div class="v">${raw(bt.sharpe)}</div><div class="k">夏普</div></div>
      <div class="kpi"><div class="v down">${num(bt.max_drawdown)}</div><div class="k">最大回撤</div></div>
      <div class="kpi"><div class="v">${num(bt.win_rate,1)}</div><div class="k">胜率</div></div>
    </div>`;
    html += lineChart(bt.equity_curve);
    html += `<table class="bt"><tr><th></th><th>年化</th><th>夏普</th><th>最大回撤</th></tr>
      <tr><td><b>本策略</b></td><td class="${cls(bt.annualized_return)}">${num(bt.annualized_return)}</td><td>${raw(bt.sharpe)}</td><td class="down">${num(bt.max_drawdown)}</td></tr>
      <tr><td>买入持有基准</td><td class="${cls(bm.annualized_return)}">${num(bm.annualized_return)}</td><td>${raw(bm.sharpe)}</td><td class="down">${num(bm.max_drawdown)}</td></tr>
    </table>`;
    html += `<div class="risk ${beat?'win':'lose'}" style="margin-top:10px">${beat?'✅ 风险调整后跑赢买入持有基准':'⚠️ 未跑赢基准,已如实呈现(不粉饰结果)'}</div>`;
  } else {
    html += `<div class="risk">${esc(bt.reason||'回测样本不足')}</div>`;
  }
  box.appendChild(c); c.innerHTML = html;

  // 4) 组合风险
  const rk = data.risk||{};
  if(rk.ok){
    const lvlmap={low:'低',medium:'中',high:'高'};
    const rc = el('div','card');
    rc.innerHTML = `<h2>📊 组合风险画像</h2>
      <div class="kpis">
        <div class="kpi"><div class="v">${lvlmap[rk.risk_level]||rk.risk_level}</div><div class="k">风险等级</div></div>
        <div class="kpi"><div class="v">${num(rk.annualized_volatility)}</div><div class="k">年化波动</div></div>
        <div class="kpi"><div class="v down">${num(rk.max_drawdown)}</div><div class="k">最大回撤</div></div>
        <div class="kpi"><div class="v">${raw(rk.concentration_hhi,3)}</div><div class="k">集中度HHI</div></div>
      </div>
      ${(rk.flags||[]).map(x=>`<div class="risk">${esc(x)}</div>`).join('')}`;
    box.appendChild(rc);
  }

  // 5) 投研报告
  box.appendChild(el('div','card', `<h2>📝 投研报告(Report Agent)</h2>
    <div class="qa">${esc(data.report)}</div>`));

  box.appendChild(el('div','src','📌 数据来源:'+esc((data.sources||[]).join(', '))));
}

function render(data){
  const box = $('#result'); box.innerHTML='';
  $('#footer').textContent = data.disclaimer || '';

  if(data.type==='error' || data.type==='empty'){
    box.appendChild(el('div','card err', `<h2>⚠️ 提示</h2><div>${esc(data.message||'请输入内容')}</div>`));
    return;
  }

  if(data.type==='multi_agent_research'){ renderWorkflow(data); return; }

  // 市场概览
  if(data.market){
    const m = data.market;
    const c = el('div','card');
    c.innerHTML = `<h2>📊 市场概览 · ${esc(m.date||'')}</h2>
      <div class="grid">${Object.entries(m.indices||{}).map(([n,v])=>indexCard(n,v)).join('')}</div>
      <div class="muted" style="margin-top:8px">情绪：${esc(m.sentiment||'')}</div>`;
    box.appendChild(c);
  }

  if(data.type==='qa'){
    box.appendChild(el('div','card', `<h2>🀄 财神解读</h2><div class="qa">${esc(data.answer)}</div>
      <div class="src">📌 数据来源：${esc((data.sources||[]).join(', '))}</div>`));
    return;
  }

  // 抽签结论横幅（由信号综合）
  const sigs = data.signals||[];
  if(sigs.length){
    const map={buy:'宜进',hold:'宜守',reduce:'宜减',watch:'宜观'};
    const top = sigs.slice().sort((a,b)=>b.confidence-a.confidence)[0];
    box.appendChild(el('div','card fortune',
      `<div class="lvl">今 日 · ${map[top.action]||'宜观'}</div>
       <div class="sen">${esc(data.marketView||'')}</div>`));
  }

  // 标的分析
  if((data.targets||[]).length){
    const c = el('div','card');
    c.innerHTML = `<h2>🎯 标的分析（指标由真实行情确定性计算）</h2>
      <div class="grid">${data.targets.filter(t=>t.assetType!=='cash').map(targetCard).join('')}</div>`;
    box.appendChild(c);
  }

  // 操作建议
  if(sigs.length){
    const c = el('div','card'); c.innerHTML = `<h2>🧭 操作建议（结论层，非投资指令）</h2>`;
    sigs.forEach(s=>{
      c.appendChild(el('div','sig',
        `<span class="badge ${ACT[s.action]||'b-watch'}">${esc(s.action_cn||s.action)}</span>
         <div class="body"><div><b>${esc(s.target)}</b> <span class="conf">信心 ${s.confidence.toFixed(2)}</span></div>
         <div>${esc(s.reason)}</div></div>`));
    });
    box.appendChild(c);
  }

  // 风险点
  if((data.risks||[]).length){
    const c = el('div','card'); c.innerHTML = `<h2>⚠️ 关键风险点</h2>`;
    data.risks.forEach(r=>c.appendChild(el('div','risk', esc(r))));
    box.appendChild(c);
  }

  box.appendChild(el('div','src','📌 数据来源：'+esc((data.sources||[]).join(', '))));
}

async function ask(){
  const text = $('#q').value.trim();
  if(!text){ $('#q').focus(); return; }
  $('#go').disabled=true; $('#loading').classList.remove('hidden'); $('#result').innerHTML='';
  try{
    const r = await fetch('/api/analyze',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({text, riskLevel:$('#risk').value})});
    const data = await r.json();
    render(data);
  }catch(e){
    render({type:'error', message:'请求失败：'+e});
  }finally{
    $('#go').disabled=false; $('#loading').classList.add('hidden');
  }
}

$('#go').addEventListener('click', ask);
$('#samples').addEventListener('click', e=>{
  if(e.target.classList.contains('chip')){ $('#q').value = e.target.textContent; ask(); }
});
